[project]
name = "project-planning-crew"
version = "0.1.0"
description = "A CrewAI crew for project planning, estimation, and resource allocation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.28,<2.0.0",
    "jinja2>=3.1.6,<4.0",
    "pydantic>=2.11,<3.0",
    "pyyaml>=6.0.2,<7.0",
]

[project.scripts]
project_planning_crew = "project_planning_crew.main:run"
run_crew = "project_planning_crew.main:run"

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "fc5d85f2-08b0-4765-856d-8166a8785341"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "notebooks"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
